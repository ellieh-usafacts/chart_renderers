<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://cdn.flourish.rocks/flourish-live-v5.1.0.min.js"></script>
  <script src="https://d3js.org/d3-selection.v2.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Aeonik';
      src: url(data:font/woff2;base64,$font_data) format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 929px;
      height: 800px;
      overflow: hidden;
      background: transparent;
    }
    .container {
      width: 100%;
      height: 800px;
      padding: 48px 32px;
      display: grid;
      grid-template-rows:
        [title]    auto
        [gap1]     32px
        [subtitle] auto
        [gap2]     16px
        [chart]    1fr
        [gap3]     32px
        [footer]   auto;
      background-color: #F7F7F3;
      border-radius: 12px;
      overflow: hidden;
    }
    .title {
      font-family: "Aeonik";
      font-size: 30px;
      font-weight: 500;
      line-height: 36px;
      letter-spacing: -0.3px;
      text-align: left;
      padding: 0;
      margin: 0;
      grid-row: title;
    }
    .subtitle {
      font-family: "Aeonik";
      font-size: 16px;
      font-weight: 500;
      line-height: 24px;
      text-align: left;
      padding: 0;
      margin: 0;
      grid-row: subtitle;
    }
    #chart {
      grid-row: chart;
      min-height: 0;
      overflow: hidden;
    }
    #chart iframe {
      width: 100% !important;
      height: 100% !important;
      display: block;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title"></h1>
    <p class="subtitle"></p>
    <div id="chart"></div>
  </div>
  <script>
    var wrapper_data = $wrapper_data;
    var chart_data = $chart_data;

    d3.select(".title").text(wrapper_data.title);
    d3.select(".subtitle").text(wrapper_data.subtitle ?? "");

    const { height } = document.getElementById("chart").getBoundingClientRect();

    new Flourish.Live({
      base_visualisation_id: chart_data.base_visualisation_id,
      api_key: "$flourish_api_key",
      container: "#chart",
      data: chart_data.data,
      bindings: chart_data.bindings,
      metadata: chart_data.metadata,
      state: chart_data.state,
      height: height,
    });
  </script>
</body>
</html>
